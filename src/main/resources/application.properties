spring.application.name=theticket

# Blokerende kode, der skalerer (PLAN.md §3) — kraever Java 24+ pga. JEP 491.
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
# Database — to roller (PLAN §2.7, tenant-isolation)
# ---------------------------------------------------------------------------
# Appen forbinder som runtime-rollen, der ikke ejer noget og ikke kan omgaa RLS.
# Flyway forbinder som migrationsbrugeren (ejeren) paa sin egen forbindelse.
# Default-vaerdierne passer til compose.yaml og er KUN til lokal udvikling.
spring.datasource.url=${THETICKET_DB_URL:jdbc:postgresql://localhost:5432/theticket}
spring.datasource.username=${THETICKET_DB_USER:theticket_runtime}
spring.datasource.password=${THETICKET_DB_PASSWORD:runtime-dev-only}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${THETICKET_DB_MIGRATION_USER:theticket}
spring.flyway.password=${THETICKET_DB_MIGRATION_PASSWORD:theticket-dev-only}

# Skemaet ejes af migrationerne. Modulith's outbox maa ALDRIG oprette sine egne
# tabeller — den ville omgaa Flyway og efterlade et skema, ingen migration kender.
# Defaulten er allerede false; den staar eksplicit, fordi den er sikkerhedskritisk.
# event_publication oprettes i V2, som matcher Modulith's eget v2-skema.
spring.modulith.events.jdbc.schema-initialization.enabled=false

# ---------------------------------------------------------------------------
# Drift
# ---------------------------------------------------------------------------
server.shutdown=graceful
# Graceful shutdown uden timeout er kun det halve: Spring venter som default 30s
# paa igangvaerende requests, mens Docker sender SIGKILL efter 10s. Den, der
# taber, er den koeber, hvis checkout var i gang. Vinduet saettes derfor
# eksplicit — og kortere end containerens stop_grace_period (compose.yaml: 30s).
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator paa egen port: load balanceren eksponerer kun 8080, mens health og
# Prometheus scrapes internt paa 8081. /actuator/prometheus er stadig bag login.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
