# Dev-profilen. Aktiveres med spring.profiles.active=dev — uden den laeses filen
# slet ikke, og saa er der hverken devseed eller fast login.

# Devseedet opretter operatoeren paa vaertsnavnet "localhost". Uden den findes
# ingen operatoer for localhost, og OperatorResolutionFilter fejler lukket med
# 421 paa ALT — foer man overhovedet naar Spring Security.
spring.flyway.locations=classpath:db/migration,classpath:db/devseed

# Fast login i stedet for Boots tilfaeldigt genererede password, som skifter ved
# hver opstart. KUN i dev-profilen: produktionen har intet default-login.
spring.security.user.name=dev
spring.security.user.password=dev
