# Fallback-bundlen — engelsk. Slår en nøgle fejl i et sprog, er det DENNE tekst,
# brugeren ser; derfor må den aldrig mangle en nøgle, der findes i messages_da.
# LocalizationOpsTest håndhæver, at alle sprogfiler har præcis samme nøglesæt.
#
# Nøgler er punktseparerede: <side/område>.<element>. Brugervendt tekst hører HER,
# aldrig i skabelonen. Exception- og log-beskeder er udviklervendte og bliver i koden.

language.switch=Language

hello.greeting=Hello world. The skeleton is running.
hello.operator=Operator
hello.stack=Spring Boot 4.1 · Java 25 · Spring Modulith

# Sprognavne vises altid i deres EGET sprog — sådan gør sprogvælgere. Derfor er
# de identiske i alle bundles; de står her, fordi nøglesættene skal matche.
language.name.da=Dansk
language.name.en=English
app.name=The Ticket
