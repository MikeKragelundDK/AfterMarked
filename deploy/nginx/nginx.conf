# Load balancer foran de to app-replikaer (compose.yaml).
#
# Docker's DNS returnerer alle replikaers adresser for "app". Med en variabel i
# proxy_pass slaar nginx navnet op igen (valid=5s) i stedet for at fryse
# adressen ved opstart — saa en genstartet replika bliver fundet igen.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Ingen nginx-version i Server-headeren og paa fejlsider. Gratis at fjerne,
    # og den fortaeller ellers en scanner praecis hvilke CVE'er der skal proeves.
    server_tokens off;

    server {
        listen 80;

        location / {
            set $upstream http://app:8080;
            # Offentlig reverse proxy — "internal;" ville lukke for al trafik. Reglen
            # sigter paa X-Accel-Redirect-locations, ikke paa en LB's rod-location.
            proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal

            # HTTP/1.1 mod upstream. Med default (1.0) faar appen ingen
            # chunked request bodies og ingen mulighed for keep-alive senere.
            proxy_http_version 1.1;

            # Vaertsnavnet SKAL bevares: det er det, appen resolver operatoeren fra.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # X-Forwarded-Host og Forwarded er klient-kontrollerede og gaar ellers
            # uaendret videre. Appen laeser dem ikke i dag (server.forward-headers-strategy
            # er bevidst NONE, og WebSecurityOpsTest beviser det) — men slaar
            # nogen den til, ville en fremmed vaerdi her flytte requesten til en
            # anden operatoer. Derfor overskrives den ene og fjernes den anden HER,
            # i kanten, hvor det er sikkert uanset hvad appen senere goer.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";

            # Rullende genstart: proev naeste replika, hvis den ene er nede.
            # BEMAERK: 'non_idempotent' er bevidst IKKE med. Uden den genfremsender
            # nginx aldrig et POST, der allerede er sendt til en replika — og det er
            # praecis dét, der ellers ville kunne udloese to betalinger for ét koeb.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            # Eksplicitte timeouts. Uden dem er read/send 60s, hvilket binder en
            # worker i et minut, naar appen haenger, i stedet for at fejle hurtigt.
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
